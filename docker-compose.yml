services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: routecalc
      POSTGRES_PASSWORD: routecalc
      POSTGRES_DB: routecalc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routecalc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Einmaliger Dienst: wendet Prisma-Migrationen an (inkl. PostGIS-Extension)
  # und beendet sich danach. Nutzt das "builder"-Image mit vollem node_modules,
  # damit die Prisma-CLI und alle ihre Abhängigkeiten sicher vorhanden sind.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://routecalc:routecalc@db:5432/routecalc?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://routecalc:routecalc@db:5432/routecalc?schema=public
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
